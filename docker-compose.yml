services:
  crosspoint-sync:
    image: ghcr.io/mafigit/crosspoint-sync:main
    ports:
      # Behind a reverse proxy on the same host, bind locally instead: "127.0.0.1:8080:8080"
      - "8080:8080"
    volumes:
      - crosspoint-data:/data
    environment:
      # Set to "true" on private instances once your accounts exist.
      REGISTRATION_DISABLED: "false"
    restart: unless-stopped
    # Hardening: the server only writes its database under /data.
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g

volumes:
  crosspoint-data:
