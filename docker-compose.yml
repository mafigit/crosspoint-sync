services:
  crosspoint-sync:
    image: ghcr.io/mafigit/crosspoint-sync:main
    ports:
      - "8080:8080"
    volumes:
      - crosspoint-data:/data
    environment:
      # Set to "true" on private instances once your accounts exist.
      REGISTRATION_DISABLED: "false"
    restart: unless-stopped

volumes:
  crosspoint-data:
