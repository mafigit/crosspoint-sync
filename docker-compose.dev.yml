services:
  crosspoint-sync:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - crosspoint-data:/data
    environment:
      # Set to "true" on private instances once your accounts exist.
      REGISTRATION_DISABLED: "false"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  crosspoint-data:
